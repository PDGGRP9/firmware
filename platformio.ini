[platformio]
default_envs = esp32-s3

[env]
; Memory configuration
board_build.partitions = default.csv   ; applies to every env
board_build.filesystem = littlefs      ; backlog storage (see storage.h)
; src/diag/ holds a diagnostic sketch with its own setup()/loop(): it must stay
; out of every build except the esp32-s3-diag env.
build_src_filter = +<*> -<diag/*>

; --- The "normal" env: the board with the hardware actually wired ---
[env:esp32-s3]
platform = espressif32
framework = arduino
board = seeed_xiao_esp32s3
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 460800
upload_protocol = esptool
lib_deps =
    dfrobot/DFRobot_BloodOxygen_S@^1.0.0
    dfrobot/DFRobot_RTU@^1.0.6
    h2zero/NimBLE-Arduino@^2.5.1 ; --- for bluetooth
    electroniccats/MPU6050

; A HAS_* flag = an EXTERNAL component actually wired. Uncomment them as the
; wiring progresses: the code of missing hardware is compiled out and replaced
; by simulated values on the sensor side.
; What is built into the chip (BLE, WiFi, deep sleep) has no flag: it is there
; on every board, including the CI one.
; Careful: an active flag is a promise. If the hardware is declared but does not
; answer at boot, the LED blinks the error code (see main.cpp).
build_flags =
    -std=c++17
    -D ARDUINO_USB_CDC_ON_BOOT=1   ; without it, no serial monitor on the XIAO
    -D ARDUINO_USB_MODE=1
    -D CORE_DEBUG_LEVEL=1
    -D HAS_IMU            ; MPU6050 (SEN0142)
    -D HAS_OXYGEN
    -D HAS_POWER_BUTTON   ; sleep button on D9 (GPIO8), wired to GND
    -D HAS_STATUS_LED     ; external status LED on D10 (GPIO9)

; --- The CI env (the bare S3 on the RPi): (almost) nothing wired ---
; This is the #ifdef guard: if the hardware code does not compile cleanly *out*,
; this build breaks.
[env:esp32-s3-ci]
platform = espressif32
framework = arduino
board = seeed_xiao_esp32s3
monitor_speed = 115200
; BLE is built into the S3 so it is always compiled: NimBLE is still needed
; here. The sensor libs are only included under HAS_OXYGEN / HAS_IMU.
lib_deps =
    h2zero/NimBLE-Arduino@^2.5.1
build_flags =
    -std=c++17
    -D ARDUINO_USB_CDC_ON_BOOT=1   ; same serial monitor as the normal env
    -D CI_BUILD
    ; no sensor declared -> the MAX30102/MPU6050/button code is compiled out

; --- Hardware diagnostic env: does NOT flash the bracelet firmware ---
; Builds only src/diag/pins_diag.cpp, which prints the raw button state and
; toggles the LED. Used to settle "it is the wiring" vs "it is the code" before
; changing anything. To be removed once the hardware is validated.
[env:esp32-s3-diag]
platform = espressif32
framework = arduino
board = seeed_xiao_esp32s3
monitor_speed = 115200
upload_speed = 460800
build_src_filter = -<*> +<diag/*>
build_flags =
    -std=c++17
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_USB_MODE=1

[env:native]
platform = native
test_framework = unity
; Only logic/ is portable (no Arduino dependency): that is what gets compiled
; and tested on PC. A new portable file must be added here.
build_src_filter = -<*> +<logic/*>
build_flags = -std=c++17 -I src
test_build_src = yes
