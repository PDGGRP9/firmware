[platformio]
default_envs = esp32-s3

[env]
; Configuration mémoire
board_build.partitions = default.csv   ; s'applique à tous les env

; --- L'env "classique" : la carte avec son matériel réellement câblé ---
[env:esp32-s3]
platform = espressif32
framework = arduino
board = seeed_xiao_esp32s3
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 460800
upload_protocol = esptool
lib_deps =
    dfrobot/DFRobot_BloodOxygen_S@^1.0.0
    dfrobot/DFRobot_RTU@^1.0.6
    h2zero/NimBLE-Arduino@^2.5.1 ; --- pour le bluetooth
    electroniccats/MPU6050

; Un flag = un morceau de matériel réellement câblé. Décommenter au fur et
; à mesure du câblage : le code du matériel absent est compilé out.
; Attention : un flag actif est une promesse. Si le matériel est déclaré mais
; ne répond pas au boot, la LED clignote le code d'erreur (voir main.cpp).
build_flags =
    -std=c++17
    -D ARDUINO_USB_CDC_ON_BOOT=1   ; sans ça, pas de moniteur série sur la XIAO
    -D CORE_DEBUG_LEVEL=1
    -D HAS_BLUETOOTH
    ; -D HAS_IMU            ; MPU6050 (SEN0142) pas encore câblé
    -D HAS_OXYGEN
    ; -D HAS_POWER_BUTTON   ; bouton de veille sur D0 pas encore câblé

; --- L'env CI (le S3 nu sur le RPi) : rien ou presque ---
; C'est le garde-fou des #ifdef : si le code matériel ne se compile pas
; proprement *out*, ce build casse.
[env:esp32-s3-ci]
platform = espressif32
framework = arduino
board = seeed_xiao_esp32s3
monitor_speed = 115200
build_flags =
    -std=c++17
    -D CI_BUILD
    ; aucun matériel déclaré → tout le code capteur/BLE/veille est compilé out

[env:native]
platform = native
test_framework = unity
; Seul logic/ est portable (pas de dépendance Arduino) : c'est ce qui est
; compilé et testé sur PC. Un nouveau fichier portable doit être ajouté ici.
build_src_filter = -<*> +<logic/*>
build_flags = -I src
test_build_src = yes
