name: CI/CD Firmware

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, build & tests natifs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: ${{ runner.os }}-pio-
      - name: Install PlatformIO
        run: pip install --upgrade platformio
      - name: Check code (cppcheck)
        run: pio check -e esp32-s3 --skip-packages
      - name: Run native unit tests
        run: pio test -e native

  build:
    name: Build firmware ESP32-S3
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: ${{ runner.os }}-pio-
      - name: Install PlatformIO
        run: pip install --upgrade platformio
      - name: Build firmware
        run: pio run -e esp32-s3
      # Garde-fou des #ifdef : verifie que tout le code materiel se compile
      # bien *out* quand aucun flag HAS_* n'est defini (carte nue, sans capteurs).
      - name: Build env CI (carte nue, sans capteurs)
        run: pio run -e esp32-s3-ci
      - name: Check firmware size
        run: pio run -e esp32-s3 --target size
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: .pio/build/esp32-s3/firmware.bin

  hardware-test:
    name: Test hardware-in-the-loop (ESP32-S3 réel)
    runs-on: [self-hosted, ARM64]
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Install PlatformIO
        run: pip install --upgrade platformio
      - name: Flash & test sur ESP32-S3 réel
        run: |
          pio run -e esp32-s3 -t upload --upload-port /dev/ttyACM0
          # pio test -e esp32-s3 --upload-port /dev/ttyACM0

  release:
    name: Release sur tag
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: firmware
          path: .pio/build/esp32-s3/
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: .pio/build/esp32-s3/firmware.bin
